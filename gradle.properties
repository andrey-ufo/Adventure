# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# 2026-11-10: lint hung 10+ min, one WorkerExecutor thread at 98% CPU,
# GC at 60-66% (secondary effect — GC served the runaway allocation).
# Root cause: androidx.fragment:fragment-ktx:1.9.1's
# UnsafeFragmentLifecycleObserverDetector infinite-recurses through
# viewLifecycleOwner.lifecycleScope.launch { ... } lambdas
# (RecursiveMethodVisitor.visitCallExpression :183 <-> :187).
# Fixed by disabling the detector's lint IDs in app/build.gradle.kts
# (disable += "FragmentLiveDataObserve" / "FragmentBackPressedCallback" /
# "FragmentAddMenuProvider"). Lint now finishes in ~50s.
# 4 GB daemon heap is kept — not the root cause, but a useful cushion
# for AGP 9.5.1 + K2 UAST on this project size.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# When enabled, the Configuration Cache allows Gradle to skip the configuration
# phase entirely if nothing that affects the build configuration (such as build scripts)
# has changed. Additionally, Gradle applies performance optimizations to task execution.
org.gradle.configuration-cache=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

systemProp.org.gradle.internal.http.connectionTimeout=60000
systemProp.org.gradle.internal.http.socketTimeout=60000